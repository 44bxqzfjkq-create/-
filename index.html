<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テトリス</title>
<style>
  :root {
    --bg: #0f0f1a;
    --panel: #1a1a2e;
    --border: #2d2d44;
    --text: #e0e0f0;
    --accent: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
  }
  .game {
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }
  canvas {
    background: #08080f;
    border: 3px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    display: block;
  }
  .side {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 150px;
  }
  .box {
    background: var(--panel);
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 12px;
  }
  .box h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8888aa;
    margin-bottom: 8px;
  }
  .box .value {
    font-size: 26px;
    font-weight: 700;
    color: var(--accent);
  }
  #next {
    background: #08080f;
    border-radius: 4px;
    display: block;
  }
  .controls {
    font-size: 11px;
    line-height: 1.7;
    color: #9999bb;
  }
  .controls b { color: var(--text); }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(8,8,15,0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 20px;
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: 42px; color: var(--accent); }
  .overlay p { color: #aaaacc; }
  button {
    background: var(--accent);
    color: #08080f;
    border: none;
    padding: 12px 32px;
    font-size: 16px;
    font-weight: 700;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.1s;
  }
  button:hover { transform: scale(1.05); }
  .touch {
    display: none;
    margin-top: 12px;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .touch button {
    padding: 14px 0;
    font-size: 18px;
    width: 64px;
  }
  @media (hover: none) and (pointer: coarse) {
    .touch { display: flex; }
  }
</style>
</head>
<body>
  <div class="game">
    <canvas id="board" width="300" height="600"></canvas>
    <div class="side">
      <div class="box">
        <h2>スコア</h2>
        <div class="value" id="score">0</div>
      </div>
      <div class="box">
        <h2>ライン</h2>
        <div class="value" id="lines">0</div>
      </div>
      <div class="box">
        <h2>レベル</h2>
        <div class="value" id="level">1</div>
      </div>
      <div class="box">
        <h2>ネクスト</h2>
        <canvas id="next" width="120" height="120"></canvas>
      </div>
      <div class="box controls">
        <b>操作方法</b><br>
        ← → : 移動<br>
        ↑ : 回転<br>
        ↓ : ソフトドロップ<br>
        スペース : ハードドロップ<br>
        P : 一時停止
      </div>
    </div>
  </div>

  <div class="touch">
    <button data-act="left">←</button>
    <button data-act="rotate">⟳</button>
    <button data-act="right">→</button>
    <button data-act="down">↓</button>
    <button data-act="drop">⤓</button>
  </div>

  <div class="overlay" id="overlay">
    <h1 id="overlay-title">テトリス</h1>
    <p id="overlay-msg">矢印キーで操作します</p>
    <button id="start-btn">スタート</button>
  </div>

<script>
(() => {
  const COLS = 10, ROWS = 20, CELL = 30;
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const nextCanvas = document.getElementById('next');
  const nctx = nextCanvas.getContext('2d');

  const scoreEl = document.getElementById('score');
  const linesEl = document.getElementById('lines');
  const levelEl = document.getElementById('level');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayMsg = document.getElementById('overlay-msg');
  const startBtn = document.getElementById('start-btn');

  // テトロミノの定義（各回転状態）と色
  const SHAPES = {
    I: { color: '#22d3ee', cells: [[1,1,1,1]] },
    O: { color: '#facc15', cells: [[1,1],[1,1]] },
    T: { color: '#c084fc', cells: [[0,1,0],[1,1,1]] },
    S: { color: '#4ade80', cells: [[0,1,1],[1,1,0]] },
    Z: { color: '#f87171', cells: [[1,1,0],[0,1,1]] },
    J: { color: '#60a5fa', cells: [[1,0,0],[1,1,1]] },
    L: { color: '#fb923c', cells: [[0,0,1],[1,1,1]] },
  };
  const TYPES = Object.keys(SHAPES);

  let board, current, next, score, lines, level, dropInterval, dropTimer, gameOver, paused, running;

  function newMatrix(rows, cols) {
    return Array.from({length: rows}, () => Array(cols).fill(null));
  }

  function rotate(cells) {
    const rows = cells.length, cols = cells[0].length;
    const res = Array.from({length: cols}, () => Array(rows).fill(0));
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        res[c][rows - 1 - r] = cells[r][c];
    return res;
  }

  function randomPiece() {
    const type = TYPES[Math.floor(Math.random() * TYPES.length)];
    const shape = SHAPES[type];
    return {
      type,
      color: shape.color,
      cells: shape.cells.map(row => [...row]),
      x: Math.floor((COLS - shape.cells[0].length) / 2),
      y: 0,
    };
  }

  function collides(piece, offX, offY, cells) {
    cells = cells || piece.cells;
    for (let r = 0; r < cells.length; r++) {
      for (let c = 0; c < cells[r].length; c++) {
        if (!cells[r][c]) continue;
        const nx = piece.x + c + offX;
        const ny = piece.y + r + offY;
        if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
        if (ny >= 0 && board[ny][nx]) return true;
      }
    }
    return false;
  }

  function merge(piece) {
    for (let r = 0; r < piece.cells.length; r++)
      for (let c = 0; c < piece.cells[r].length; c++)
        if (piece.cells[r][c]) {
          const ny = piece.y + r, nx = piece.x + c;
          if (ny >= 0) board[ny][nx] = piece.color;
        }
  }

  function clearLines() {
    let cleared = 0;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r].every(cell => cell)) {
        board.splice(r, 1);
        board.unshift(Array(COLS).fill(null));
        cleared++;
        r++;
      }
    }
    if (cleared > 0) {
      const points = [0, 100, 300, 500, 800];
      score += points[cleared] * level;
      lines += cleared;
      level = Math.floor(lines / 10) + 1;
      dropInterval = Math.max(100, 1000 - (level - 1) * 90);
      updateStats();
    }
  }

  function updateStats() {
    scoreEl.textContent = score;
    linesEl.textContent = lines;
    levelEl.textContent = level;
  }

  function spawn() {
    current = next;
    next = randomPiece();
    drawNext();
    if (collides(current, 0, 0)) {
      endGame();
    }
  }

  function drop() {
    if (!collides(current, 0, 1)) {
      current.y++;
    } else {
      merge(current);
      clearLines();
      spawn();
    }
  }

  function hardDrop() {
    while (!collides(current, 0, 1)) current.y++;
    drop();
  }

  function move(dir) {
    if (!collides(current, dir, 0)) current.x += dir;
  }

  function tryRotate() {
    const rotated = rotate(current.cells);
    // 壁蹴り（簡易）
    for (const kick of [0, -1, 1, -2, 2]) {
      if (!collides(current, kick, 0, rotated)) {
        current.cells = rotated;
        current.x += kick;
        return;
      }
    }
  }

  function drawCell(context, x, y, color, size) {
    context.fillStyle = color;
    context.fillRect(x * size, y * size, size, size);
    context.fillStyle = 'rgba(255,255,255,0.2)';
    context.fillRect(x * size, y * size, size, size * 0.15);
    context.strokeStyle = 'rgba(0,0,0,0.35)';
    context.lineWidth = 1;
    context.strokeRect(x * size + 0.5, y * size + 0.5, size - 1, size - 1);
  }

  function ghostY() {
    let gy = 0;
    while (!collides(current, 0, gy + 1)) gy++;
    return gy;
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // グリッド
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    for (let c = 0; c <= COLS; c++) {
      ctx.beginPath();
      ctx.moveTo(c * CELL, 0);
      ctx.lineTo(c * CELL, canvas.height);
      ctx.stroke();
    }
    for (let r = 0; r <= ROWS; r++) {
      ctx.beginPath();
      ctx.moveTo(0, r * CELL);
      ctx.lineTo(canvas.width, r * CELL);
      ctx.stroke();
    }
    // 積まれたブロック
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (board[r][c]) drawCell(ctx, c, r, board[r][c], CELL);

    if (current) {
      // ゴースト
      const gy = ghostY();
      for (let r = 0; r < current.cells.length; r++)
        for (let c = 0; c < current.cells[r].length; c++)
          if (current.cells[r][c]) {
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.fillRect((current.x + c) * CELL, (current.y + gy + r) * CELL, CELL, CELL);
          }
      // 現在のピース
      for (let r = 0; r < current.cells.length; r++)
        for (let c = 0; c < current.cells[r].length; c++)
          if (current.cells[r][c])
            drawCell(ctx, current.x + c, current.y + r, current.color, CELL);
    }
  }

  function drawNext() {
    nctx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
    if (!next) return;
    const size = 24;
    const w = next.cells[0].length, h = next.cells.length;
    const offX = (nextCanvas.width - w * size) / 2;
    const offY = (nextCanvas.height - h * size) / 2;
    for (let r = 0; r < h; r++)
      for (let c = 0; c < w; c++)
        if (next.cells[r][c]) {
          nctx.save();
          nctx.translate(offX, offY);
          drawCell(nctx, c, r, next.color, size);
          nctx.restore();
        }
  }

  let lastTime = 0, acc = 0;
  function loop(time) {
    if (!running || paused || gameOver) return;
    const dt = time - lastTime;
    lastTime = time;
    acc += dt;
    if (acc >= dropInterval) {
      drop();
      acc = 0;
    }
    draw();
    requestAnimationFrame(loop);
  }

  function startGame() {
    board = newMatrix(ROWS, COLS);
    score = 0; lines = 0; level = 1;
    dropInterval = 1000;
    gameOver = false; paused = false; running = true;
    next = randomPiece();
    spawn();
    updateStats();
    overlay.classList.add('hidden');
    lastTime = performance.now();
    acc = 0;
    requestAnimationFrame(loop);
  }

  function endGame() {
    gameOver = true;
    running = false;
    overlayTitle.textContent = 'ゲームオーバー';
    overlayMsg.textContent = 'スコア: ' + score;
    startBtn.textContent = 'もう一度';
    overlay.classList.remove('hidden');
  }

  function togglePause() {
    if (gameOver || !running) return;
    paused = !paused;
    if (paused) {
      overlayTitle.textContent = '一時停止';
      overlayMsg.textContent = 'Pキーまたはボタンで再開';
      startBtn.textContent = '再開';
      overlay.classList.remove('hidden');
    } else {
      overlay.classList.add('hidden');
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }
  }

  function handleAction(act) {
    if (!running || paused || gameOver) return;
    switch (act) {
      case 'left': move(-1); break;
      case 'right': move(1); break;
      case 'rotate': tryRotate(); break;
      case 'down': drop(); acc = 0; break;
      case 'drop': hardDrop(); break;
    }
    draw();
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'p' || e.key === 'P') { togglePause(); return; }
    const map = {
      ArrowLeft: 'left', ArrowRight: 'right',
      ArrowUp: 'rotate', ArrowDown: 'down', ' ': 'drop',
    };
    if (map[e.key]) {
      e.preventDefault();
      handleAction(map[e.key]);
    }
  });

  document.querySelectorAll('.touch button').forEach(btn => {
    btn.addEventListener('click', () => handleAction(btn.dataset.act));
  });

  startBtn.addEventListener('click', () => {
    if (paused && !gameOver) { togglePause(); return; }
    startGame();
  });
})();
</script>
</body>
</html>
